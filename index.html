<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Dungeons & Degenerates | Damien Port</title>
    <style>
      body { margin: 0; background: #0d0d0d; color: #ff4d4d; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
      #game-wrapper { width: 960px; height: 540px; border: 2px solid #5b3943; position: relative; background: #000; border-radius: 8px; }
      #canvas { width: 100%; height: 100%; display: block; }
      #status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; }
      progress { width: 50%; accent-color: #ff4d4d; height: 12px; }
      button { padding: 15px 35px; background: #ff4d4d; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; text-transform: uppercase; }
    </style>
    <script src="https://raw.githack.com/SnakierdoorCode/DungeonsAndDegenerates/master/index.js"></script>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="canvas"></canvas>
      <div id="status">
        <h2 id="msg">DUNGEON ENTRANCE</h2>
        <progress id="bar" value="0" max="100" style="display:none;"></progress><br>
        <button id="start-btn">ENTER DUNGEON</button>
      </div>
    </div>

    <script>
      const msg = document.getElementById('msg');
      const bar = document.getElementById('bar');
      const btn = document.getElementById('start-btn');
      const BASE = "https://raw.githubusercontent.com/SnakierdoorCode/DungeonsAndDegenerates/master/";

      btn.onclick = async () => {
        btn.style.display = 'none';
        bar.style.display = 'block';
        console.log("🚀 Boot sequence initiated by Damien.");
        
        try {
          // --- PART 1 ---
          msg.innerText = "GATHERING DATA (1/2)...";
          const r1 = await fetch(BASE + 'index.pck.001');
          if (!r1.ok) throw new Error("Could not find index.pck.001 on GitHub.");
          const p1 = await r1.arrayBuffer();
          console.log("✅ Part 1 Loaded: " + p1.byteLength + " bytes");
          bar.value = 40;

          // --- PART 2 ---
          msg.innerText = "GATHERING DATA (2/2)...";
          const r2 = await fetch(BASE + 'index.pck.002');
          if (!r2.ok) throw new Error("Could not find index.pck.002 on GitHub.");
          const p2 = await r2.arrayBuffer();
          console.log("✅ Part 2 Loaded: " + p2.byteLength + " bytes");
          bar.value = 80;

          // --- MERGE ---
          msg.innerText = "RECONSTRUCTING DUNGEON...";
          const combined = new Uint8Array(p1.byteLength + p2.byteLength);
          combined.set(new Uint8Array(p1), 0);
          combined.set(new Uint8Array(p2), p1.byteLength);
          console.log("🛠️ PCK Reconstructed. Total size: " + combined.byteLength + " bytes");

          // --- ENGINE SETUP ---
          const dummyPck = new Blob([new Uint8Array([0])], {type: "application/octet-stream"});
          const dummyUrl = URL.createObjectURL(dummyPck);

          const engine = new Engine({
              "args": ["--main-pack", "index.pck"],
              "canvasResizePolicy": 2,
              "executable": "https://raw.githack.com/SnakierdoorCode/DungeonsAndDegenerates/master/index",
              "fileSizes": {"index.wasm": 43699190},
              "pck": dummyUrl 
          });

          // --- INJECTION ---
          msg.innerText = "IGNITING ENGINE...";
          console.log("💉 Injecting PCK data into virtual filesystem...");
          await engine.preloadFile(combined.buffer, "index.pck");
          console.log("💎 Injection complete. Starting Godot...");

          engine.startGame().then(() => {
            console.log("🎮 Game started successfully!");
            document.getElementById('status').style.display = 'none';
          });

        } catch (e) {
          console.error("❌ FATAL ERROR:", e.message);
          msg.innerText = "FATAL ERROR: " + e.message;
        }
      };
    </script>
  </body>
</html>
